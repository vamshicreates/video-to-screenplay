name: macOS and Windows compatibility

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Check Python tools
        run: |
          python -m py_compile scripts/prepare_video.py scripts/transcribe.py scripts/render_fountain.py scripts/render_illustrated.py scripts/runtime.py scripts/check_install.py
          python -c "import av; import faster_whisper"
          python scripts/render_fountain.py tests/smoke.fountain smoke.html
          python scripts/render_illustrated.py --help
      - name: Check macOS installer syntax
        if: runner.os == 'macOS'
        run: bash -n scripts/setup-macos.sh
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/setup-windows.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
